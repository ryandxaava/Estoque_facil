{% extends "base.html" %}{% block content %}<h1>Registrar movimentação</h1><section class="card"><form method="post"><label>Produto<select name="product_id" required>{% for p in products %}<option value="{{p.id}}">{{p.name}} (saldo {{p.quantity}})</option>{% endfor %}</select></label><label>Tipo<select name="kind"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></label><label>Quantidade<input type="number" name="quantity" min="1" required></label><label>Observação<input name="note"></label><button {% if not products %}disabled{% endif %}>Salvar</button></form></section>{% endblock %}
