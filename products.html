{% extends "base.html" %}{% block content %}<h1>Produtos</h1><section class="card"><h2>Novo produto</h2><form method="post"><label>Nome<input name="name" required></label><label>SKU<input name="sku"></label><label>Quantidade inicial<input type="number" name="quantity" min="0" value="0"></label><label>Estoque mínimo<input type="number" name="min_quantity" min="0" value="0"></label><button>Cadastrar</button></form></section><section class="card"><h2>Lista</h2><table><tr><th>Produto</th><th>SKU</th><th>Saldo</th></tr>{% for p in products %}<tr><td>{{p.name}}</td><td>{{p.sku or '—'}}</td><td>{{p.quantity}}</td></tr>{% endfor %}</table></section>{% endblock %}
